<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Selected artifacts from Skill Shelf</title>
  <desc id="desc">A three-card vector specimen wall for Hallmark, Herdr, and Superpowers, showing design output, agent orchestration, and curated workflow skills.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E9E4D8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#F8F5ED"/>
  <rect x="1" y="1" width="1198" height="518" rx="27" fill="url(#grid)" opacity="0.56"/>
  <rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#D9D2C4" stroke-width="2"/>

  <g transform="translate(64 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2" fill="#847C70">SELECTED SHELF / REAL OUTPUTS</text>
    <text x="0" y="50" font-size="42" font-weight="800" letter-spacing="-1" fill="#302D29">Things this catalog helps make.</text>
    <text x="0" y="82" font-size="21" font-weight="500" fill="#625D55">Three specimens, three kinds of useful leverage.</text>
  </g>

  <g id="hallmark-card" transform="translate(64 170)">
    <rect width="344" height="278" rx="18" fill="#FFFDF8" stroke="#D9D2C4" stroke-width="2"/>
    <rect x="18" y="18" width="308" height="156" rx="12" fill="#F1D7D1" stroke="#E4BDB5"/>
    <text x="38" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#302D29">/ hallmark</text>
    <text x="38" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#302D29">Make your agent</text>
    <text x="38" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#302D29">a designer</text>
    <path d="M38 144H202" stroke="#302D29" stroke-width="2"/>
    <circle cx="270" cy="122" r="25" fill="#D4AA48"/>
    <rect x="250" y="94" width="40" height="11" rx="5" fill="#1C7887" transform="rotate(-12 270 100)"/>
    <rect x="244" y="142" width="52" height="10" rx="5" fill="#1C7887" transform="rotate(10 270 147)"/>
    <text x="22" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#8A6B2D">01 / DESIGN VISUAL</text>
    <text x="22" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#49443D">structure before decoration</text>
  </g>

  <g id="herdr-card" transform="translate(428 170)">
    <rect width="344" height="278" rx="18" fill="#222328" stroke="#4C4D55" stroke-width="2"/>
    <rect x="18" y="18" width="308" height="156" rx="12" fill="#17181D" stroke="#77717A"/>
    <circle cx="40" cy="39" r="5" fill="#D4AA48"/>
    <circle cx="57" cy="39" r="5" fill="#77717A"/>
    <circle cx="74" cy="39" r="5" fill="#77717A"/>
    <path d="M42 72H147M42 93H224M42 114H182M42 135H126" stroke="#A7A2B1" stroke-width="8" stroke-linecap="round"/>
    <path d="M242 71H298M242 92H279M242 113H300M242 134H273" stroke="#D4AA48" stroke-width="8" stroke-linecap="round"/>
    <text x="22" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#D4AA48">02 / ORCHESTRATION</text>
    <text x="22" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#F8F5ED">many panes, one clear state</text>
  </g>

  <g id="superpowers-card" transform="translate(792 170)">
    <rect width="344" height="278" rx="18" fill="#FFFDF8" stroke="#D9D2C4" stroke-width="2"/>
    <rect x="18" y="18" width="308" height="156" rx="12" fill="#EFE9D9" stroke="#D9D2C4"/>
    <path d="M48 58H288M48 83H288M48 108H210M48 133H246" stroke="#C7BEAE" stroke-width="8" stroke-linecap="round"/>
    <rect x="48" y="52" width="64" height="12" rx="6" fill="#302D29"/>
    <rect x="48" y="102" width="104" height="12" rx="6" fill="#D4AA48"/>
    <rect x="48" y="127" width="146" height="12" rx="6" fill="#302D29"/>
    <circle cx="276" cy="119" r="29" fill="#D4AA48"/>
    <path d="M263 119L272 128L291 106" fill="none" stroke="#302D29" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#8A6B2D">03 / CURATED PICKS</text>
    <text x="22" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#49443D">a shorter path to good work</text>
  </g>

  <text x="64" y="492" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1" fill="#847C70">THE PROOF IS THE SHELF: REAL SKILLS, REAL PROJECTS, CLEAR EDGES.</text>
</svg>
