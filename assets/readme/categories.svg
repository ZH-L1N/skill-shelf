<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Skill Shelf categories</title>
  <desc id="desc">A four-row index of the Skill Shelf categories: Dev Workflow, Agent Orchestration, Design and Visual, and Curated Picks.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E9E4D8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="28" fill="#F8F5ED"/>
  <rect x="1" y="1" width="1198" height="398" rx="27" fill="url(#grid)" opacity="0.54"/>
  <rect x="1" y="1" width="1198" height="398" rx="27" fill="none" stroke="#D9D2C4" stroke-width="2"/>

  <g transform="translate(64 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2" fill="#847C70">THE INDEX / FOUR SHELVES</text>
    <text x="0" y="42" font-size="30" font-weight="700" fill="#302D29">Find the kind of leverage you need.</text>
  </g>

  <g id="category-rows" transform="translate(64 126)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(0 0)">
      <rect width="1072" height="56" rx="12" fill="#FFFDF8" stroke="#D9D2C4"/>
      <text x="22" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#8A6B2D">01</text>
      <text x="92" y="38" font-size="30" font-weight="800" fill="#302D29">Dev Workflow</text>
      <text x="430" y="37" font-size="22" fill="#625D55">plan · build · test · ship</text>
      <rect x="1012" y="18" width="28" height="20" rx="6" fill="#D4AA48"/>
    </g>
    <g transform="translate(0 64)">
      <rect width="1072" height="56" rx="12" fill="#FFFDF8" stroke="#D9D2C4"/>
      <text x="22" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#8A6B2D">02</text>
      <text x="92" y="38" font-size="30" font-weight="800" fill="#302D29">Agent Orchestration</text>
      <text x="540" y="37" font-size="22" fill="#625D55">coordinate · delegate · verify</text>
      <rect x="1012" y="18" width="28" height="20" rx="6" fill="#302D29"/>
    </g>
    <g transform="translate(0 128)">
      <rect width="1072" height="56" rx="12" fill="#FFFDF8" stroke="#D9D2C4"/>
      <text x="22" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#8A6B2D">03</text>
      <text x="92" y="38" font-size="30" font-weight="800" fill="#302D29">Design &amp; Visual</text>
      <text x="430" y="37" font-size="22" fill="#625D55">shape · animate · present</text>
      <rect x="1012" y="18" width="28" height="20" rx="6" fill="#D4AA48"/>
    </g>
    <g transform="translate(0 192)">
      <rect width="1072" height="56" rx="12" fill="#302D29"/>
      <text x="22" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#D4AA48">04</text>
      <text x="92" y="38" font-size="30" font-weight="800" fill="#F8F5ED">Curated Picks</text>
      <text x="430" y="37" font-size="22" fill="#D9D2C4">keep the good shortcuts close</text>
      <rect x="1012" y="18" width="28" height="20" rx="6" fill="#D4AA48"/>
    </g>
  </g>
</svg>
